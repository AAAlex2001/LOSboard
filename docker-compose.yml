name: losboard

x-backend-common: &backend-common
  build:
    context: ./backend
  image: losboard-backend:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    JWT_ALGORITHM: ${JWT_ALGORITHM}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
    CORS_ORIGINS: ${CORS_ORIGINS}
    ECHO_SQL: ${ECHO_SQL}
    DB_POOL_SIZE: ${DB_POOL_SIZE}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT}
    DB_POOL_RECYCLE: ${DB_POOL_RECYCLE}
    DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT}
    ADMIN_BASE_URL: ${ADMIN_BASE_URL}
    SITE_URL: ${SITE_URL}
    INDEXNOW_KEY: ${INDEXNOW_KEY}
    SMTP_HOST: ${SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT}
    SMTP_USER: ${SMTP_USER}
    SMTP_PASSWORD: ${SMTP_PASSWORD}
    SMTP_FROM: ${SMTP_FROM}
    SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    SMTP_SSL: ${SMTP_SSL}
  volumes:
    - backend_uploads:/app/uploads
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  networks:
    - app
    - db

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-common
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ECHO_SQL: ${ECHO_SQL}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      SITE_URL: ${SITE_URL}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_SSL: ${SMTP_SSL}
      RUN_MIGRATIONS: "1"

  backend-replica:
    <<: *backend-common
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000/
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - backend_uploads:/var/www/uploads:ro
    networks:
      - app

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'
    networks:
      - app

volumes:
  postgres_data:
  backend_uploads:

networks:
  app:
  db:
    internal: true
